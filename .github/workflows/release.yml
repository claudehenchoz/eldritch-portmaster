name: Build and Release

on:
  push:
    branches: [ main ]
    tags:
      - 'v*' # Release on tags like v1.0, v2.0, etc.
  pull_request:
  workflow_dispatch: # Allow manual runs

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container: ubuntu:20.04 # Build inside Ubuntu 20.04 so the binary needs at most glibc 2.31

    steps:
    - name: Prerequisites
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        apt-get update && apt-get install -y git zip unzip

    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up multiarch and install toolchain
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        dpkg --add-architecture arm64
        # Restrict the default sources to amd64 and add arm64 from ports.ubuntu.com
        sed -i 's/deb http/deb [arch=amd64] http/g' /etc/apt/sources.list
        echo "deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports focal main restricted universe multiverse" >> /etc/apt/sources.list
        echo "deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports focal-updates main restricted universe multiverse" >> /etc/apt/sources.list
        echo "deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports focal-security main restricted universe multiverse" >> /etc/apt/sources.list
        apt-get update
        apt-get install -y --no-install-recommends \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            cmake \
            make \
            pkg-config \
            file \
            libsdl2-dev:arm64 \
            libgles2-mesa-dev:arm64 \
            zlib1g-dev:arm64

    - name: Build
      run: |
        mkdir -p build-portmaster
        cd build-portmaster
        cmake -DCMAKE_TOOLCHAIN_FILE="../toolchain-aarch64.cmake" -DPORTMASTER=ON -DCMAKE_BUILD_TYPE=Release -DFINAL_ENABLED=ON ../Code
        make -j$(nproc) Eld
        aarch64-linux-gnu-strip -o ../ports/eldritch/eldritch/eldritch.aarch64 Projects/Eld/Eld
        file ../ports/eldritch/eldritch/eldritch.aarch64

    - name: Check binary dependencies and glibc version
      run: bash tools/check_binary.sh ports/eldritch/eldritch/eldritch.aarch64

    - name: Package
      run: |
        bash tools/package.sh eldritch.zip
        unzip -l eldritch.zip

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: eldritch-portmaster
        path: eldritch.zip

    - name: Publish release
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
      with:
        tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}
        name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'Latest Build' }}
        files: eldritch.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
